<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="howTitle howDesc">
  <title id="howTitle">随手问请求流向</title>
  <desc id="howDesc">浏览器扩展把选中的内容发到本机 DSH 插件，插件开只读会话问模型，回答按 NDJSON 流回到小框。</desc>

  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#f8fafc"/>

  <text x="64" y="54" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#0f172a">一次提问，四步来回</text>
  <text x="64" y="82" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748b">扩展只连本机 3080；模型由你自己的 DSH 配置决定。</text>

  <!-- 1 浏览器页面 / 扩展 -->
  <g>
    <rect x="64" y="190" width="220" height="160" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="88" y="232" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#0f172a">浏览器页面 / 扩展</text>
    <text x="88" y="262" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">选中文字 / 框选截图</text>
    <text x="88" y="284" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">小框里看回答</text>
    <rect x="88" y="308" width="78" height="22" rx="11" fill="#f1f5f9"/>
    <text x="127" y="323" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">当前标签页</text>
  </g>

  <!-- 2 DSH 插件 -->
  <g>
    <rect x="387" y="190" width="250" height="160" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="387" y="190" width="250" height="4" rx="2" fill="#3b82f6"/>
    <text x="411" y="232" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#0f172a">DSH 插件</text>
    <text x="411" y="258" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">进程内会话</text>
    <rect x="411" y="278" width="100" height="24" rx="12" fill="#dbeafe"/>
    <text x="461" y="294" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1d4ed8">只读 · 0 工具</text>
    <text x="411" y="326" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">127.0.0.1:3080</text>
  </g>

  <!-- 3 模型接口 -->
  <g>
    <rect x="740" y="190" width="250" height="160" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="764" y="232" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#0f172a">模型接口</text>
    <text x="764" y="262" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">你配置的模型</text>
    <text x="764" y="284" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">本机或远程</text>
    <text x="764" y="310" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#94a3b8">deepseek-flash 等</text>
  </g>

  <!-- 去程箭头 -->
  <line x1="284" y1="282" x2="381" y2="282" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="333" y="252" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">HTTP POST</text>
  <text x="333" y="266" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">/page-chat/ask</text>

  <line x1="637" y1="282" x2="734" y2="282" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="686" y="252" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">系统提示 +</text>
  <text x="686" y="266" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">对话上下文</text>

  <!-- 模型回答回插件 -->
  <line x1="740" y1="318" x2="643" y2="318" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrowBlue)"/>
  <text x="690" y="334" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#3b82f6">回答</text>

  <!-- 插件把 NDJSON 写回扩展 -->
  <path d="M 590 350 L 590 500 L 174 500 L 174 354" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="520" y="524" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#3b82f6">NDJSON 流：ack → delta → done</text>

  <!-- 注释 1 -->
  <rect x="387" y="390" width="3" height="44" rx="1.5" fill="#3b82f6"/>
  <text x="400" y="406" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">网页侧会话：0 工具</text>
  <text x="400" y="426" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748b">网页内容不能反过来指挥插件</text>

  <!-- 注释 2 -->
  <text x="64" y="558" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#475569">记忆存本地 ~/.dsh/page-chat-memory</text>
  <text x="64" y="576" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#94a3b8">卡片、对话原文、截图都在这个目录</text>

  <text x="64" y="606" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#cbd5e1">请求先到本机，再由 DSH 转发给你配置的模型。</text>
</svg>

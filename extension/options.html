<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>随手问 · 设置</title>
<style>
  /* 样式全在这一个文件里：不引外部字体、图片、脚本（扩展的 CSP 也不允许内联 JS）。 */
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1a1a;
    --sub: #6b7280;
    --line: #e3e6ea;
    --accent: #2a6df4;
    --accent-ink: #ffffff;
    --ok: #1a7f37;
    --bad: #b42318;
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card: #1f2227;
      --text: #e8eaed;
      --sub: #9aa1ab;
      --line: #33373d;
      --accent: #6a9bff;
      --accent-ink: #0d1117;
      --ok: #4ecb71;
      --bad: #ff8b82;
      --field: #14161a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .lede { color: var(--sub); font-size: 13px; margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"] {
    flex: 1 1 240px;
    min-width: 200px;
    padding: 9px 11px;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 9px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    padding: 9px 14px;
    font: inherit;
    font-size: 13px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .6; cursor: default; }
  .status { margin-top: 12px; font-size: 13px; min-height: 20px; word-break: break-word; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  .hint { margin-top: 6px; color: var(--sub); font-size: 12px; }
  .saved {
    display: none;
    margin: 0 0 14px;
    padding: 9px 12px;
    border-radius: 9px;
    background: color-mix(in srgb, var(--ok) 12%, transparent);
    color: var(--ok);
    font-size: 13px;
  }
  .saved.show { display: block; }
  details {
    margin-top: 18px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    background: var(--card);
  }
  summary { cursor: pointer; font-size: 13px; color: var(--sub); }
  details p { margin: 10px 0 0; font-size: 13px; }
  code {
    font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 5px;
  }
  .foot { margin-top: 18px; color: var(--sub); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>随手问 · 设置</h1>
  <p class="lede">小框连的是你本机的 DSH。DSH 换了端口，就在这里把地址改过来。</p>

  <div class="saved" id="saved" role="status"></div>

  <div class="card">
    <label for="base">DSH 地址</label>
    <div class="row">
      <input id="base" type="text" spellcheck="false" autocomplete="off"
             placeholder="http://127.0.0.1:3080" />
      <button id="test" type="button">测试连接</button>
      <button id="save" type="button" class="primary">保存</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="hint" id="hint">只填 <code>127.0.0.1:3081</code> 也行，会自动补成 <code>http://</code>。</div>
  </div>

  <details>
    <summary>怎么查我的端口？</summary>
    <p>端口就是启动 DSH 时 <code>--port</code> 后面那个数。比如用 <code>dsh web --port 3081</code> 启动，地址就是 <code>http://127.0.0.1:3081</code>；没写 <code>--port</code> 一般是 3080。</p>
    <p>忘了的话，回头看启动它的那个窗口，第一行打的地址就是。</p>
  </details>

  <p class="foot">地址只存在这台浏览器里，不会上传。改完回网页刷新一下才生效。</p>
</main>
<script src="options.js"></script>
</body>
</html>
